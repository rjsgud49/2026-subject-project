name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd ~/2026-subject-project
            git pull origin main
            cd p3/backend
            npm install
            npm run build
            pm2 restart p3-backend --update-env || pm2 start ecosystem.config.cjs
            curl -sf http://127.0.0.1:3000/api/v1/health || (echo "백엔드 헬스체크 실패 — pm2 logs p3-backend 확인" && exit 1)
            cd ../frontend
            npm install
            npm run build
            echo "배포 완료"
