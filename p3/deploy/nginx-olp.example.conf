# EC2 nginx 예시 — /etc/nginx/conf.d/olp.conf
# 프론트: p3/frontend/dist  |  API: localhost:3000
# HTTPS(443) 없으면 결제 returnUrl(https://...) 접속 시 ERR_CONNECTION_TIMED_OUT 발생

server {
    listen 80;
    server_name olp.rjsgud.com;

    root /home/ec2-user/2026-subject-project/p3/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS (Let's Encrypt) — 설치 후 certbot 이 443 server 블록을 자동 추가
# sudo dnf install -y certbot python3-certbot-nginx
# sudo certbot --nginx -d olp.rjsgud.com
